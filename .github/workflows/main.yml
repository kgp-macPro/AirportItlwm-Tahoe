name: Tahoe 2.0.0 source and build validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tahoe-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Pinned 2.0.0 inputs, AX and BE200 regressions, compatibility build
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - name: Verify toolchain and pinned production, SDK, firmware and references
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          python3 -B tools/verify_release_source.py
          git diff --check
      - name: Actual AX and BE200 host regressions
        run: python3 -B tools/validate_release.py build/release-validation
      - name: Tahoe Release x86_64 compatibility build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          build_root="$GITHUB_WORKSPACE/build/tahoe"
          xcodebuild -project itlwm.xcodeproj \
            -target AirportItlwm-Tahoe -configuration Release ARCHS=x86_64 \
            MODULE_VERSION=2.0.0 \
            SYMROOT="$build_root/products" OBJROOT="$build_root/intermediates" \
            SHARED_PRECOMPS_DIR="$build_root/precompiled" \
            CLANG_MODULE_CACHE_PATH="$build_root/module-cache" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            2>&1 | tee build/ci-evidence/BUILD_LOG.txt
          python3 -B tools/verify_release_source.py
      - name: Label hosted output separately from release binary
        run: python3 tools/package_ci.py build/tahoe/products/Release/Tahoe/AirportItlwm.kext build/ci-evidence
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CI-NOT-PHYSICALLY-VALIDATED-${{ github.sha }}
          path: |
            build/ci-evidence/
            build/release-validation/
          if-no-files-found: error
          retention-days: 7
